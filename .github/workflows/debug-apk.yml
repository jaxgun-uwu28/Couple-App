name: Debug APK
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/shared/**
      - assets/characters/**
      - pnpm-lock.yaml
      - .github/workflows/debug-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - run: pnpm android:sync
      - name: Verify the runner's installed Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
      - run: bash gradlew assembleDebug
        working-directory: apps/web/android
      - uses: actions/upload-artifact@v4
        with:
          name: paw-and-us-phase3-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
